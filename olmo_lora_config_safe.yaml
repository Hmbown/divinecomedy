# LoRA configuration for Olmo-3-7B-Think-SFT training
# SAFE MODE: Resource-constrained settings to prevent CPU/memory crashes

# Model
model: mlx-community/Olmo-3-7B-Think-SFT-4bit

# Training settings - SAME AS SUCCESSFUL OLMO TRAINING
train: true
batch_size: 2              # Same as working config (peaks at ~8.7GB)
iters: 250
learning_rate: 1.0e-5
max_seq_length: 2048       # Same as working config
grad_checkpoint: true      # Critical for memory savings

# LoRA settings (optimized for 7B model)
fine_tune_type: lora
num_layers: 24
lora_parameters:
  rank: 16       # Increased from 8 for larger model capacity
  scale: 32.0    # Maintains 2x ratio with rank
  dropout: 0.05  # Light regularization

# Reporting - Same as working config
steps_per_report: 10
steps_per_eval: 50
save_every: 100

# Optimizer
optimizer: adamw
